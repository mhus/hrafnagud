spring:
  application:
    name: hrafnagud
  mongodb: # since spring 7 the connection properties live under spring.mongodb.*
    uri: ${HRAFNAGUD_MONGO_URI:mongodb://root:example@localhost:27017/hrafnagud?authSource=admin}
    database: ${HRAFNAGUD_MONGO_DB:hrafnagud}
  data:
    mongodb:
      # Makes Spring Data honour @Indexed / @CompoundIndex / @TextIndexed on
      # the entities. Without it the annotations are dead decoration: the
      # unique index on articles.dedupKey would not exist, deduplication
      # would degrade to a best-effort application check, and the claim
      # queries would run as collection scans.
      auto-index-creation: true
  threads:
    virtual:
      # Ingest is almost entirely blocked on remote servers. Virtual threads
      # make a request-per-thread model cheap enough that no pool tuning is
      # needed for it.
      enabled: true
  web:
    error:
      # Let the message through so a 400 is diagnosable with curl — an
      # unknown ?pipeline= or a missing ?value= is raised by the framework,
      # not by MuninExceptionHandler, and without this it arrives as a bare
      # status the console renders as "HTTP 400". Stack traces stay off.
      #
      # Boot 4 moved this from server.error.* and ignores the old path
      # without a word, so it sat here dead.
      include-message: always

server:
  port: ${HRAFNAGUD_PORT:9800}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
  info:
    env:
      # Off by default since Boot 2.6, and without it the info.* keys below are
      # silently absent. They carry the CC BY notice for the bundled data, and
      # this is the one place it reaches somebody who only ever runs the
      # container — see NOTICE.
      enabled: true

info:
  data:
    iptc-media-topics: >-
      Category vocabulary from IPTC Media Topics (https://iptc.org/standards/newscodes/),
      licensed CC BY 4.0. Modified: projected to id, parent, name and normalised
      labels; other metadata dropped.
    places: >-
      Place hierarchy derived from UN M49 (https://unstats.un.org/unsd/methodology/m49/)
      joined to ISO 3166-1 alpha-2.

# ─────────────────────────────────────────────────────────────────────────────
# THREE ROOTS, ONE PER LAYER. munin.* collects and stores, hugin.* thinks
# (anything that hands text to a model), hrafnagud.* is what belongs to neither.
# A key names the layer that owns the value, so munin.category.acceptConfidence
# tunes the local table match at ingest while hugin.category.* is the worker
# that asks a brain about what the match could not settle.
#
# Most of what follows is the DEFAULT for a setting of the same name, not the
# last word on it. An operator can override any of these while the service runs
# — through /api/v1/settings or the console's Einstellungen view — and the
# override then wins until it is deleted. So an unexpected value at runtime is
# answered by looking at that list, where each entry says whether it comes from
# here or from the database.
#
# Read only at start-up, and therefore NOT settings: every tickInterval and
# initialDelay (they are baked into @Scheduled), munin.http.connectTimeout and
# munin.http.proxy.* (baked into the shared HTTP client), munin.api.* (the
# console switch decides whether a surface exists at all; the token is a secret
# and stays in the environment), munin.catalog.installBundled (only applies to
# an empty database), munin.language.lowAccuracyMode and .languages (the
# detector is built once), munin.feed.profiles (structure, not a number),
# munin.centauri/.zarniwoop.enabled (they decide whether an endpoint exists),
# and hrafnagud.settings.refreshInterval itself.
# Reasoning and the full boundary: specs/settings.md.
# ─────────────────────────────────────────────────────────────────────────────
munin:
  # Catalogues — the layer that discovers source lists, so the archive fills
  # itself. Catalogue → source lists → sources, each refreshed on its own
  # schedule; nothing here needs a button.
  catalog:
    enabled: ${HRAFNAGUD_CATALOG_ENABLED:true}
    tickInterval: PT15M
    defaultInterval: PT24H
    claimLease: PT30M
    # A fresh database gets awesome-rss-feeds (CC0) as TWO catalogues, both
    # installed DISABLED: one for its news half (countries/, profile news)
    # and one for its blog half (recommended/, profile blog). They want poll
    # intervals two orders of magnitude apart, and a catalogue carries one
    # profile — so one catalogue could not describe both honestly.
    #
    # Enable what you want in the console. Running only news means switching
    # on one of the two.
    installBundled: ${HRAFNAGUD_INSTALL_BUNDLED_CATALOG:true}

  # The operator API and the console at /console/ (redirected to from /).
  api:
    # Bearer token for /api/v1/**. Empty means no check, which is how this
    # service has always run — right on a loopback binding, wrong on anything
    # reachable, because this API deletes as well as reads. The startup log
    # says which of the two you have.
    token: ${HRAFNAGUD_API_TOKEN:}
    # The console holds no data and no credential; it asks for the token and
    # keeps it in the browser. Off is for installations that want no HTML
    # surface at all.
    consoleEnabled: ${HRAFNAGUD_CONSOLE_ENABLED:true}

  http:
    # Identify the crawler and give publishers somebody to contact. Replace
    # the URL with a real contact before running this at any scale — an
    # anonymous crawler is one that gets blocked.
    userAgent: "Hrafnagud/0.1 (+https://github.com/mhus/hrafnagud; news aggregator)"
    connectTimeout: PT10S
    readTimeout: PT30S
    maxBodyBytes: 8388608
    # Outbound proxy for every request — feeds, source lists, article pages
    # and robots.txt alike. Leave the host empty (or drop the block) to
    # connect directly. A host without a valid port fails at startup rather
    # than silently going direct, which in an environment that requires the
    # proxy would break every fetch far away from the mistake.
    proxy:
      host: ${HRAFNAGUD_PROXY_HOST:}
      port: ${HRAFNAGUD_PROXY_PORT:0}
    # Across all workers, per host. The single most important politeness
    # control once a directory import puts fifty feeds of one publisher into
    # the registry.
    minHostInterval: PT2S

  feed:
    enabled: true
    tickInterval: PT30S
    batchSize: 20
    defaultInterval: PT30M
    minInterval: PT5M
    maxInterval: PT12H
    busyThreshold: 5
    maxFailureInterval: PT24H
    claimLease: PT10M
    maxItemsPerFeed: 500
    maxSummaryChars: 4000
    maxFutureSkew: PT6H
    # Named interval classes. The values above are the unnamed default and
    # stay the fallback for anything a profile leaves unset, so this block
    # changes nothing until a catalogue, list or source names a profile.
    #
    # The point is the ceiling: the adaptive policy only moves within the
    # bounds it is given, so a blog that posts monthly is polled at the
    # maximum forever — 60 requests per article at 12 h, 4 at a week.
    profiles:
      news:
        defaultInterval: PT30M
        minInterval: PT5M
        maxInterval: PT12H
      blog:
        defaultInterval: P1D
        minInterval: PT6H
        maxInterval: P7D

  content:
    # Off by default. Fetching publisher pages is a different activity from
    # reading the feeds they publish for polling, and should be a decision
    # the operator makes rather than one that happens by installing this.
    enabled: false
    tickInterval: PT15S
    batchSize: 20
    maxAttempts: 3
    retryDelay: PT10M
    claimLease: PT5M
    minWordCount: 60
    maxTextChars: 200000
    respectRobots: true
    robotsCacheTtl: PT6H

  source-list:
    enabled: true
    tickInterval: PT5M
    defaultInterval: PT24H
    # A guard against a pathological document, not a policy — published
    # lists of five figures exist. Cost is bounded by the poll interval and
    # the per-host limiter, not by this number.
    maxEntries: 50000
    # A round drains what is due rather than trickling: batchSize is the
    # lease granularity, maxPerRound the ceiling that makes a round end. A
    # catalogue delivers its lists all due at once, and a fixed handful per
    # tick would spread the first import over an hour.
    batchSize: 5
    maxPerRound: 200
    claimLease: PT15M

  # Category normalisation: what publishers call their sections, mapped onto
  # IPTC Media Topics. Only stage one lives here — string matching against the
  # bundled vocabulary, at ingest, costing nothing. Stage two asks a brain and
  # is therefore Hugin's; see hugin.category below.
  category:
    # Exact label match scores 1.0, token-set match 0.9, single-word match
    # 0.4 — so the last never resolves on its own. Lowering this below 0.4
    # would let "standard" become a topic.
    acceptConfidence: 0.9

  # Filter rules: which articles are worth a body fetch and worth translating.
  # No switch here — with no rules written everything is accepted, which is what
  # an off switch would do anyway. Rules live in the database and are written in
  # the console; these two numbers only bound re-evaluating stored articles,
  # which is the one expensive operation. See specs/filter.md.
  filter:
    maxPerRun: 50000
    batchSize: 500

  language:
    enabled: true
    # Below this many characters of title plus teaser, detection abstains.
    # A confident wrong language is worse than an honest unknown.
    minChars: 40
    # All languages in high-accuracy mode costs several GB of heap. Low
    # accuracy costs a few hundred MB and only differs on very short input,
    # which minChars already excludes.
    lowAccuracyMode: true
    # Empty means every language Lingua knows. Narrowing it to the languages
    # actually present in the registry is both faster and more accurate.
    languages: []

  # Named for the Vancetope subsystem it serves, not `feed`, because
  # munin.feed above is the opposite direction: that one pulls feeds in,
  # this one hands the archive out.
  centauri:
    # Serve the archive to Vancetope as a Centauri feed source.
    #
    # On by default, and the default sits here rather than in the library
    # for a reason: `vance-ode-centauri` cannot know whether its host wants
    # to serve, so there it is opt-in. Hrafnagud does — answering a reader
    # is what these packages are for, and a collector that has to be told
    # to hand anything out has the switch on the wrong side.
    #
    # It stays a switch, for the deployment that only collects. What it is
    # not is a security boundary: the endpoint is unauthenticated until
    # `vance.ode.centauri.apiKey` is set, but so is the operator API above
    # — and that one deletes. Both assume a loopback binding or a proxy in
    # front (see README, "Known gaps").
    enabled: ${HRAFNAGUD_CENTAURI_ENABLED:true}

  # The other Vancetope-facing read surface: a research provider. Same
  # archive, opposite question — Centauri hands out a timeline, this one
  # answers a query. Independently switchable because serving one is not a
  # reason to serve the other.
  zarniwoop:
    enabled: ${HRAFNAGUD_ZARNIWOOP_ENABLED:true}

# Vancetope binding (vance-ode). Everything here is inert until base-url
# is set — no client, no translation provider, no outbound traffic. The
# brain side is the `translation` kit: it defines the event, the script
# and the recipe, so the prompt and the model stay editable there rather
# than being compiled in here.
# ─────────────────────────────────────────────────────────────────────────────
# Hugin — thought. Everything that hands text to a model and stores what comes
# back. Its workers are off by default, and unlike Munin's that is not about
# politeness: this half spends model time somebody pays for, so it starts when
# an operator says so and not because a service was deployed.
# ─────────────────────────────────────────────────────────────────────────────
hugin:
  translation:
    # Master switch for the worker. Off by default: a translation spends
    # somebody else's model time and somebody's money, so it is a decision
    # rather than something that happens by deploying. Off stops the worker,
    # not the queue — what gets queued is decided by pivotLanguage below, so
    # setting that with this off means a backlog nothing drains. The startup
    # log says which of the four states you are in.
    enabled: ${HRAFNAGUD_TRANSLATION_ENABLED:false}
    # Which provider does the work: `vance-ode` fires an event at a brain,
    # `gemini` calls Google's API from here. Empty means "the only one that
    # is wired" — honest while there is one, an error state once there are
    # two, because guessing which way to spend money is not a default. Both
    # can be wired at once and switched at runtime; that is how the same
    # articles get compared, since each result records its model.
    provider: ${HRAFNAGUD_TRANSLATION_PROVIDER:}
    # The one language everything is normalised into. Empty means no
    # article is ever queued and the subsystem stays dormant. Setting it
    # starts filling a backlog — make sure something is wired to work it
    # (see vance.ode below), or the queue grows with nothing draining it.
    #
    # readableLanguages below is the other half of the decision: languages
    # that need no translation at all. The pivot is always one of them, so
    # list only the OTHER languages a reader here can already read —
    # `pivotLanguage: de` plus `readableLanguages: [en]` translates neither
    # German nor English and queues everything else. An empty list means
    # every non-German article is translated, which for a bilingual reader
    # is paying for half the archive twice.
    #
    # One language, not a list: this is the step that lets later stages —
    # keywords, clustering, embeddings — work in a single language.
    pivotLanguage: ${HRAFNAGUD_PIVOT_LANGUAGE:}
    # Comma-separated BCP-47 primary subtags, e.g. `en` or `en,fr`. An
    # article whose language is unknown is translated anyway — see
    # specs/translation.md §3.
    readableLanguages: ${HRAFNAGUD_READABLE_LANGUAGES:}
    # Title and teaser go in one call either way; switching this off saves
    # the teaser's tokens but not a request.
    translateSummary: true
    tickInterval: PT20S
    batchSize: 10
    maxAttempts: 3
    retryDelay: PT5M
    claimLease: PT5M
    maxSourceChars: 8000

  # Direct model access — the provider that skips the brain. Off unless a key
  # is set; the key is a secret and therefore only ever an environment
  # variable, never a setting (specs/settings.md §5).
  gemini:
    apiKey: ${GEMINI_API_KEY:}
    # As Google's API names it. Flash-Lite is the cheap end; Google renames
    # and retires these on its own schedule, which is why it is a setting.
    model: ${HRAFNAGUD_GEMINI_MODEL:gemini-3.5-flash-lite}
    # Translation is not a creative task, and the same text coming back
    # differently on every call would make two runs incomparable.
    temperature: 0.1
    # Shorter than the brain path's PT150S: there, a script waits for a
    # model; here there is only the model.
    timeout: PT60S

  # The second stage of category normalisation: what stage one could not
  # settle is handed to a brain. Off by default, because it spends model time.
  #
  # Cost note worth keeping in view: a category is resolved ONCE for the whole
  # archive, so this follows the size of the vocabulary (~7k) and not the
  # number of articles.
  category:
    enabled: ${HRAFNAGUD_CATEGORY_ENABLED:false}
    tickInterval: PT30S
    batchSize: 10
    maxAttempts: 3
    retryDelay: PT10M
    claimLease: PT5M

# The service itself — what belongs to neither half.
hrafnagud:
  # How often stored overrides are re-read. Writes through the API are visible
  # at once; this is for a value changed straight in the database. Not itself a
  # setting — that would be a loop.
  settings:
    refreshInterval: PT30S

vance:
  ode:
    # Empty means no brain, and is checked as such: Ode's own condition treats
    # a present-but-empty value as configured, so the packages under hugin/ ask
    # BrainAddress before they wire anything. Without that the startup report
    # would claim a provider on an installation that has none.
    base-url: ${VANCE_BRAIN_URL:}
    tenant: ${VANCE_TENANT:}
    project: ${VANCE_PROJECT:_tenant}
    events:
      translate-article:
        token: ${VANCE_TRANSLATE_TOKEN:}
        # A model call is slow by HTTP standards; this has to clear the
        # brain-side script timeout, not undercut it.
        timeout: PT150S
    # The served side — endpoints Vancetope calls, rather than calls we
    # make, which is why base-url/tenant/project above do not apply to it.
    # Only mounted when munin.centauri.enabled is true.
    centauri:
      path: ${HRAFNAGUD_CENTAURI_PATH:/ode/feed}
      # Expected as `Authorization: Bearer <key>`. Empty means no check —
      # fine behind a reverse proxy that already authenticates, wide open
      # otherwise. The startup log says which of the two you have.
      apiKey: ${HRAFNAGUD_CENTAURI_API_KEY:}
      # Ceiling on what one request may cost, independent of what the
      # source declares it can serve.
      maxLimit: 200
    zarniwoop:
      path: ${HRAFNAGUD_ZARNIWOOP_PATH:/ode/search}
      apiKey: ${HRAFNAGUD_ZARNIWOOP_API_KEY:}
      # A research call sits inside a tool call somebody is waiting on, so
      # this is smaller than the feed's: a big page costs the model's
      # context, not just our disk.
      maxResults: 25

logging:
  level:
    de.mhus.hrafnagud: INFO
