    "articleBody": "Il consiglio comunale ha approvato martedì sera il piano dei trasporti discusso da quasi tre anni, chiudendo un dibattito concentrato soprattutto sul finanziamento della linea nord.\n\nGli oppositori hanno giudicato ottimistiche le stime dei costi, citando progetti analoghi in regioni vicine che alla fine sono costati molto più del previsto.\n\nI sostenitori hanno risposto con i dati sui passeggeri di città simili: secondo i loro calcoli l'ampliamento si ripaga in dodici anni, se arriverà la quota statale promessa.\n\nL'avvio dei lavori è previsto per la prossima primavera, al termine della procedura di approvazione contro cui alcuni residenti hanno già presentato ricorso."
