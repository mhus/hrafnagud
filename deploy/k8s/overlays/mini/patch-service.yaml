apiVersion: v1
kind: Service
metadata:
  name: hrafnagud
spec:
  # NodePort, not an Ingress: Caddy on this host terminates TLS for every
  # site on the machine and proxies to 127.0.0.1:<nodePort>. 30980 keeps the
  # last three digits of the service port, and stays clear of the ports the
  # vance namespace already uses (30090 brain, 30091 face).
  type: NodePort
  ports:
    - name: http
      port: 9800
      targetPort: http
      nodePort: 30980
