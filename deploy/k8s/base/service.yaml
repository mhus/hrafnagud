apiVersion: v1
kind: Service
metadata:
  name: hrafnagud
  labels:
    app: hrafnagud
spec:
  # ClusterIP: the REST API is guarded by one shared token and nothing else
  # — no accounts, no rate limit, no audit — so the base does not expose it
  # beyond the cluster whatever HRAFNAGUD_API_TOKEN says. Reach it with
  # `kubectl port-forward`, or put a reverse proxy in front of it; the mini
  # overlay does the latter and only publishes the Ode paths.
  type: ClusterIP
  selector:
    app: hrafnagud
  ports:
    - name: http
      port: 9800
      targetPort: http
