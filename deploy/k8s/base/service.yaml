apiVersion: v1
kind: Service
metadata:
  name: hrafnagud
  labels:
    app: hrafnagud
spec:
  # ClusterIP: the REST API has no authentication, so the base must not
  # expose it beyond the cluster. Reach it with `kubectl port-forward`, or
  # put a reverse proxy in front of it — the mini overlay does the latter and
  # only publishes the API-key-protected Centauri path.
  type: ClusterIP
  selector:
    app: hrafnagud
  ports:
    - name: http
      port: 9800
      targetPort: http
