apiVersion: v1
kind: ConfigMap
metadata:
  name: hrafnagud-config
  labels:
    app: hrafnagud
data:
  SPRING_PROFILES_ACTIVE: "prod"

  # Database name inside the MongoDB the Secret's URI points at.
  HRAFNAGUD_MONGO_DB: "hrafnagud"

  # Identify the crawler and give publishers somebody to contact before
  # running this at any scale.
  HRAFNAGUD_USER_AGENT: "Hrafnagud/0.1 (+https://github.com/mhus/hrafnagud; news aggregator)"

  # Fetching publisher article pages is a separate activity from polling the
  # feeds they publish — an explicit operator decision, not a side effect of
  # deploying.
  HRAFNAGUD_CONTENT_ENABLED: "false"

  # Comma-separated ISO codes, e.g. "de,en,fr". Empty means every language
  # Lingua knows: slower, and the largest single contributor to heap usage.
  # Narrow this first when the pod approaches its memory limit.
  HRAFNAGUD_LANGUAGES: ""

  # Outbound proxy for every fetch. A host set without a valid port fails at
  # startup rather than quietly connecting directly.
  HRAFNAGUD_PROXY_HOST: ""
  HRAFNAGUD_PROXY_PORT: "0"

  HRAFNAGUD_LOG_LEVEL: "INFO"

  # ── Translation ──────────────────────────────────────────────────────
  # The one language everything is normalised into. Empty keeps the
  # subsystem dormant; setting it starts filling a backlog, so only set it
  # once the brain binding below is complete and something is draining the
  # queue.
  # Two switches, because they control different things: the worker, and
  # what gets queued at ingest. Clearing the pivot language to pause
  # translation would mark everything ingested meanwhile as SKIPPED for good.
  HRAFNAGUD_TRANSLATION_ENABLED: "false"
  HRAFNAGUD_PIVOT_LANGUAGE: ""
  # Languages that need no translation at all, comma-separated. The pivot
  # language always counts as one, so list only the others a reader here can
  # already read — with pivot "de" and this "en", neither German nor English
  # articles are queued.
  HRAFNAGUD_READABLE_LANGUAGES: ""
  # Which provider does the work: "vance-ode" (a brain) or "gemini" (the
  # model, called directly). Empty picks the only one that is wired, and is
  # an error state when both are — nothing translates until this names one.
  HRAFNAGUD_TRANSLATION_PROVIDER: ""
  # Only for the gemini path. As Google's API names it; they rename and
  # retire these on their own schedule, which is why it is reachable here
  # rather than baked in.
  HRAFNAGUD_GEMINI_MODEL: "gemini-3.5-flash-lite"

  # Vancetope binding. Everything stays inert while VANCE_BRAIN_URL is
  # empty — no client, no translation provider, no outbound traffic. The
  # matching token is in the Secret.
  VANCE_BRAIN_URL: ""
  VANCE_TENANT: ""
  VANCE_PROJECT: "_tenant"

  # ── Catalogues ───────────────────────────────────────────────────────
  # The layer that discovers source lists. The bundled awesome-rss-feeds
  # catalogue is installed DISABLED: ~840 feeds are ~1,700 outbound requests
  # an hour, and a deploy should not start crawling by itself. Enable it in
  # the console once the pod is up.
  HRAFNAGUD_CATALOG_ENABLED: "true"
  HRAFNAGUD_INSTALL_BUNDLED_CATALOG: "true"

  # ── Operator API and console ─────────────────────────────────────────
  # The console at / is HTML and JavaScript only; it holds no data and asks
  # for the token itself. The token that actually guards /api/v1/** is
  # HRAFNAGUD_API_TOKEN in the Secret.
  HRAFNAGUD_CONSOLE_ENABLED: "true"

  # ── Centauri ─────────────────────────────────────────────────────────
  # Serve the archive back to Vancetope as a feed source. Off by default:
  # collecting news should not imply publishing it, and the endpoint is
  # unauthenticated unless HRAFNAGUD_CENTAURI_API_KEY (Secret) is set.
  HRAFNAGUD_CENTAURI_ENABLED: "false"
  HRAFNAGUD_CENTAURI_PATH: "/ode/feed"

  # ── Zarniwoop ────────────────────────────────────────────────────────
  # The other Vancetope-facing read surface: the same archive answering a
  # query instead of handing out a timeline. Independently switchable —
  # serving one is not a reason to serve the other — and unauthenticated
  # unless HRAFNAGUD_ZARNIWOOP_API_KEY (Secret) is set.
  HRAFNAGUD_ZARNIWOOP_ENABLED: "false"
  HRAFNAGUD_ZARNIWOOP_PATH: "/ode/search"
